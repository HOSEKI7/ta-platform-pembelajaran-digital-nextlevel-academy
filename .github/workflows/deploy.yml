name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "SHA/branch yang dideploy (kosongkan = main terbaru). Isi SHA lama untuk rollback."
        required: false

# Satu deploy pada satu waktu; deploy berikutnya antre (tidak saling timpa):
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tentukan SHA release
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Type-check & lint
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Audit dependency (informasi, tidak memblokir)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Build (standalone)
        env:
          BUILD_STANDALONE: "1"
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ vars.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY }}
          BUNNY_STORAGE_PULL_ZONE: ${{ vars.BUNNY_STORAGE_PULL_ZONE }}
          # Dummy server-side: `next build` mengeksekusi module scope (mis. auth.ts)
          # saat mencoba prerender. Semua halaman app dynamic, jadi nilai dummy ini
          # TIDAK pernah ter-bake ke output build. Nilai asli HANYA ada di app.env VPS.
          BETTER_AUTH_SECRET: "ci-build-dummy-secret-not-used-at-runtime"
          DATABASE_URL: "postgresql://build:build@127.0.0.1:5432/build"
          DIRECT_URL: "postgresql://build:build@127.0.0.1:5432/build"
        run: npm run build

      - name: Pack artifact
        run: |
          cp -r .next/static .next/standalone/.next/static
          rm -rf .next/standalone/public
          cp -r public .next/standalone/public
          sync
          tar -C .next/standalone -czf release.tar.gz .
          du -h release.tar.gz

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload release
        run: >
          scp release.tar.gz
          "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/nextlevel/releases/incoming-${RELEASE_SHA}.tar.gz"

      - name: Aktifkan release (health check + auto-rollback)
        run: >
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          bash -s -- "${RELEASE_SHA}" "${{ secrets.REVALIDATION_SECRET }}" < scripts/deploy/activate-release.sh
